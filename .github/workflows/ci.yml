# Version: 1.0.0
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  pylint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pylint and lint dependencies
        run: python -m pip install --upgrade pip pylint homeassistant aiohttp voluptuous

      - name: Run pylint
        env:
          PY_COLORS: "1"
        run: |
          pylint --output-format=colorized --rcfile=.pylintrc custom_components/info_lan_for_home_assistant | tee pylint-report.txt

      - name: Upload pylint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pylint-report
          path: pylint-report.txt

  hacs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run Hassfest validation
        uses: home-assistant/actions/hassfest@master

  trigger-pages:
    if: github.event_name != 'pull_request'
    needs:
      - pylint
      - hacs
      - hassfest
    runs-on: ubuntu-latest

    steps:
      - name: Trigger pages.yml in OddanN/ha_page
        env:
          GH_TOKEN: ${{ secrets.HA_PAGE_WORKFLOW_TOKEN }}
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/OddanN/ha_page/actions/workflows/pages.yml/dispatches \
            -d '{"ref":"main"}'
