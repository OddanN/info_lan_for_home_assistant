# Version: 1.0.0
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  pylint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pylint and lint dependencies
        run: python -m pip install --upgrade pip pylint homeassistant aiohttp voluptuous

      - name: Run pylint
        env:
          PY_COLORS: "1"
        run: |
          pylint --output-format=colorized --rcfile=.pylintrc custom_components/info_lan_for_home_assistant | tee pylint-report.txt

      - name: Upload pylint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pylint-report
          path: pylint-report.txt

  hacs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run Hassfest validation
        uses: home-assistant/actions/hassfest@master

  trigger-pages:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs:
      - pylint
      - hacs
      - hassfest
    runs-on: ubuntu-latest

    steps:
      - name: Trigger ci.yml from the latest OddanN/ha_page release
        env:
          GH_TOKEN: ${{ secrets.HA_PAGE_WORKFLOW_TOKEN }}
        run: |
          HA_PAGE_REF="$(
            curl --fail-with-body \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              https://api.github.com/repos/OddanN/ha_page/releases/latest \
            | jq -r '.tag_name'
          )"

          if [ -z "${HA_PAGE_REF}" ] || [ "${HA_PAGE_REF}" = "null" ]; then
            echo "Unable to determine the latest OddanN/ha_page release tag" >&2
            exit 1
          fi

          echo "Latest OddanN/ha_page release: ${HA_PAGE_REF}"

          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/OddanN/ha_page/actions/workflows/ci.yml/dispatches \
            -d "{\"ref\":\"${HA_PAGE_REF}\"}"
